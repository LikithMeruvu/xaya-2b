[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xaya-2b"
version = "0.0.0"
description = "XAYA-2B multimodal decision inference and ordinal scoring SDK"
keywords = ["xaya", "multimodal", "decision-model", "jevbench", "qwen", "inference"]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "torch>=2.5",
  "transformers==5.17.0",
  "peft==0.21.1",
  "bitsandbytes==0.49.0",
  "accelerate>=1.10,<2",
  "safetensors>=0.6",
  "Pillow>=10",
]

[project.urls]
Repository = "https://github.com/LikithMeruvu/xaya-2b"
Documentation = "https://github.com/LikithMeruvu/xaya-2b/blob/main/docs/INFERENCE.md"

[tool.setuptools]
packages = ["xaya"]
